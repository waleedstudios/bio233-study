{title:"Introduction to A&P",subtitle:"Anatomy, organization, homeostasis and cavities",lessons:[
["Anatomy and physiology","Anatomy studies structures and relationships. Physiology studies how those structures function.","Ask your partner to describe the structure of the heart versus what the heart does.","The structure is the heart and its chambers; the function is pumping blood."],
["Levels of organization","Chemical → cellular → tissue → organ → organ system → organism.","Have your partner place a muscle cell, muscle tissue, and a muscle organ in order.","Cell → tissue → organ."],
["Homeostasis and feedback","Homeostasis maintains a relatively stable internal environment. A receptor detects change; a control center evaluates it; an effector responds. Negative feedback counteracts a change. Positive feedback amplifies it until an endpoint.","Use rising body temperature: receptors detect the change, control center processes it, sweat glands act, and temperature moves toward normal.","Ask which part senses, decides and acts. Compare sweating with blood clotting."],
["Anatomical language and cavities","Anatomical position is the reference. Sagittal divides left/right; frontal divides front/back; transverse divides upper/lower. Dorsal contains cranial and vertebral cavities. Ventral contains thoracic and abdominopelvic cavities.","Point to your own body and ask for superior, inferior, medial, lateral, proximal and distal.","Visceral serosa covers organs; parietal serosa lines cavity walls."]]},
{title:"Chemical level",subtitle:"Atoms, bonds, reactions and macromolecules",lessons:[
["Atoms and ions","Protons are positive, neutrons neutral, electrons negative. Atomic number is proton count; mass number is protons plus neutrons. Isotopes differ in neutrons.","Draw an atom and change only its neutron count.","Losing an electron forms a positive cation; gaining one forms a negative anion."],
["Chemical bonds and water","Ionic bonds involve attraction between oppositely charged ions; covalent bonds share electrons; hydrogen bonds are weak attractions important in water. Water is polar.","Ask why water molecules attract one another.","Hydrogen bonding contributes to cohesion and surface tension."],
["Reactions, enzymes and pH","Synthesis builds; decomposition breaks down; exchange swaps partners. Enzymes lower activation energy without being consumed. Acids increase H+; buffers resist pH change.","Compare building a chain with breaking one apart.","pH below 7 is acidic, 7 neutral and above 7 basic."],
["Biological molecules","Carbohydrates supply/store energy; triglycerides store energy; phospholipids form membranes. Proteins are amino acids joined by peptide bonds. DNA/RNA are nucleic acids; ATP transfers usable energy.","Have your partner match a molecule to its main role.","Protein shape matters to function."]]},
{title:"Cellular level",subtitle:"Membranes, organelles, transport and division",lessons:[
["Membranes and organelles","The plasma membrane is a phospholipid bilayer: hydrophilic heads face water, hydrophobic tails face inward. Nucleus stores DNA; ribosomes make protein; rough ER handles protein; smooth ER handles lipids; Golgi sorts; mitochondria produce ATP; lysosomes digest.","Ask your partner to describe a cell as a workplace and assign each organelle a job.","Cytosol is the fluid portion of cytoplasm."],
["Transport and tonicity","Simple diffusion moves down a gradient; facilitated diffusion uses channels/carriers; osmosis moves water; active transport requires energy; endocytosis brings bulk material in and exocytosis moves it out.","Draw a cell in a hypertonic solution and ask where water goes.","Hypotonic: water enters. Hypertonic: water leaves. Isotonic: no net movement."],
["DNA and protein synthesis","DNA wraps around histones. Transcription makes RNA from DNA; translation uses ribosomes, mRNA and tRNA to assemble a polypeptide.","Ask your partner to put DNA → RNA → protein in words.","mRNA carries coding information; tRNA carries amino acids; rRNA is part of ribosomes."],
["Cell cycle","Interphase consists of G1, S and G2; DNA replicates in S. Mitosis proceeds prophase, metaphase, anaphase, telophase; cytokinesis divides cytoplasm.","Ask your partner to explain why DNA must replicate before division.","Have them recite PMAT in order."]]},
{title:"Tissue level",subtitle:"Epithelial, connective, muscle and nervous tissue",lessons:[
["Four tissue categories","Epithelial tissue covers, lines and secretes; connective supports, binds and stores; muscle contracts; nervous tissue communicates.","Point to a body structure and ask which category best describes it.","Epithelial tissue is avascular and rests on a basement membrane."],
["Epithelial identification","Simple means one layer; stratified means multiple. Squamous cells are flat, cuboidal are cube-like and columnar are tall. Transitional epithelium stretches.","Identify layer count first, then the shape of surface cells.","Simple squamous supports rapid diffusion; stratified squamous protects."],
["Connective tissue","Connective tissue includes cells and extracellular matrix. Areolar cushions/binds, adipose stores energy, reticular supports. Hyaline, elastic and fibrocartilage have distinct support roles.","Ask what fibroblasts produce and why extracellular matrix matters.","Dense regular resists pull in one direction; dense irregular resists stress in multiple directions."],
["Muscle and nervous tissue","Skeletal muscle is voluntary, striated and multinucleate. Cardiac is striated and has intercalated discs. Smooth is nonstriated and spindle-shaped. Neurons conduct signals; neuroglia support.","Compare muscle types without looking at notes.","Repair may involve regeneration or fibrosis (scar)."]]}];

const conceptExplanations=["Anatomy describes body structures and how they relate to one another; physiology explains what those structures do.","Physiology focuses on function—for example, how the heart contracts and moves blood.","Organization progresses from chemicals to cells, tissues, organs, organ systems, and the whole organism. Each level combines components from the previous level.","Homeostasis keeps internal conditions within a workable range, rather than at one perfectly fixed value.","Intrinsic regulation is a local response within an organ or tissue, without requiring a command from another organ system.","Extrinsic regulation comes from outside the tissue; the nervous and endocrine systems coordinate many body-wide responses.","Negative feedback reverses a deviation from a set range. Sweating when temperature rises is an example.","Positive feedback strengthens the original change until a particular endpoint occurs, as in blood clotting.","A receptor is the sensor: it detects a change in the internal or external environment.","An effector performs the response, such as a muscle contracting or a gland releasing a secretion.","Anatomical position is the standardized reference: standing upright, facing forward, arms at sides, palms forward.","Superior means toward the head or above another structure; the chest is superior to the abdomen.","Medial means closer to the body's midline; the nose is medial to the eyes.","Distal means farther from a limb's point of attachment; the fingers are distal to the elbow.","Superficial means nearer the body surface; skin is superficial to muscle. Deep means farther from the surface.","A sagittal plane divides the body into left and right portions; a midsagittal plane divides equal halves.","A frontal (coronal) plane divides anterior/front and posterior/back portions.","A transverse plane divides superior/upper and inferior/lower portions.","The cranial cavity is within the skull and houses the brain.","The vertebral (spinal) cavity contains the spinal cord.","The diaphragm is the muscular partition separating the thoracic cavity from the abdominopelvic cavity.","The pleural cavities surround the lungs; each lung has its own pleural cavity.","The pericardial cavity surrounds the heart, between the serous pericardial layers.","Visceral serosa is the membrane layer directly covering an organ; parietal serosa lines the cavity wall.","Parietal serosa lines the cavity wall, while visceral serosa covers the organ itself.","Protons have a positive charge and are located in the atomic nucleus.","Electrons carry a negative charge and occupy regions around the nucleus.","Neutrons have no electrical charge and are found in the nucleus.","Atomic number equals the number of protons; changing that number changes the element.","Mass number counts protons plus neutrons in an atom's nucleus.","Isotopes are atoms of the same element with different numbers of neutrons, so their mass numbers differ.","Valence electrons are in the outermost occupied shell and largely determine how an atom bonds.","A cation has a net positive charge, usually because an atom lost one or more electrons.","An anion has a net negative charge, usually because an atom gained electrons.","Covalent bonds form when atoms share electrons.","Ionic bonds are electrostatic attractions between positively and negatively charged ions.","Hydrogen bonds are relatively weak attractions involving a partially positive hydrogen and another electronegative atom.","Water is polar because electrons are shared unequally, creating partial positive and negative regions.","The solute is the substance dissolved; salt is the solute in salt water.","The solvent does the dissolving; water is the solvent in salt water.","An electrolyte dissociates into ions in solution, allowing that solution to conduct electricity.","A synthesis reaction combines smaller components into a larger product; it is a building reaction.","A decomposition reaction breaks a larger substance into smaller components.","Activation energy is the energy barrier a reaction must overcome; enzymes lower this barrier.","Enzymes are catalysts: they participate in a reaction but are not used up by it.","An acidic solution has a pH below 7 and a relatively high hydrogen-ion concentration.","Buffers resist large pH changes by accepting or releasing hydrogen ions.","Peptide bonds link amino acids together to form polypeptide chains.","A protein's primary structure is its amino-acid sequence; that sequence influences later folding and function.","DNA stores hereditary information in its nucleotide sequence.","Phospholipids are major membrane components; their water-loving heads and water-avoiding tails form a bilayer.","Hydrophilic means attracted to or interacting with water; phospholipid heads are hydrophilic.","Hydrophobic means avoiding water; phospholipid fatty-acid tails face inward in the membrane.","Cytosol is the intracellular fluid; cytoplasm includes cytosol and structures outside the nucleus.","Interstitial fluid is extracellular fluid located between the cells of a tissue.","The nucleus houses most of a cell's DNA and helps direct cell activities.","The nucleolus is a region inside the nucleus where ribosomal RNA is produced and ribosome subunits are assembled.","Ribosomes translate mRNA instructions to assemble amino acids into proteins.","Rough ER has attached ribosomes and helps synthesize and process proteins destined for secretion, membranes, or organelles.","Smooth ER lacks attached ribosomes and participates in lipid synthesis and other metabolic functions.","The Golgi apparatus modifies, sorts, and packages proteins and lipids for their destinations.","Mitochondria produce much of the cell's ATP through aerobic cellular respiration.","Lysosomes contain digestive enzymes that break down worn-out components and ingested material.","Passive transport moves substances down their concentration or electrochemical gradients without direct ATP expenditure.","Facilitated diffusion is passive movement down a gradient through a membrane channel or carrier protein.","Osmosis is the net movement of water across a selectively permeable membrane toward the side with greater effective solute concentration.","In a hypertonic environment, water moves out of a cell, causing it to shrink.","In a hypotonic environment, water moves into a cell, causing it to swell.","Active transport uses energy to move substances, often against their concentration gradient.","Endocytosis brings material into a cell by enclosing it in a membrane vesicle.","Histone proteins help package DNA into chromatin.","Transcription uses a DNA template to produce RNA.","Translation occurs at ribosomes, where an mRNA sequence directs protein assembly.","Transfer RNA (tRNA) carries specific amino acids to the ribosome and matches anticodons with mRNA codons.","DNA replication happens in the S (synthesis) phase of interphase, before cell division.","The four primary tissue classes are epithelial, connective, muscle, and nervous.","Epithelial tissue covers surfaces, lines cavities and passageways, and forms glands.","Epithelia are avascular, meaning they contain no blood vessels; nutrients diffuse from underlying connective tissue.","The apical surface is the exposed or free surface of epithelial tissue, opposite its basal attachment.","The basement membrane supports and anchors epithelium to underlying connective tissue.","Simple epithelium is one cell layer thick, so each cell contacts the basement membrane.","Stratified epithelium has multiple layers, often providing protection against abrasion.","Squamous cells are thin and flat, which suits simple squamous epithelium for rapid exchange.","Cuboidal cells are roughly as tall as they are wide, common in ducts and kidney tubules.","Columnar cells are taller than they are wide and often specialize in absorption or secretion.","Tight junctions seal spaces between adjacent cells, limiting passage between them.","Gap junctions form channels allowing ions and small molecules to pass directly between neighboring cells.","Simple squamous epithelium is a single layer of thin cells, ideal for diffusion, such as in lung alveoli.","Transitional epithelium changes shape as urinary organs stretch, especially in the bladder.","Exocrine glands release secretions onto a surface or into a duct; endocrine glands release hormones into surrounding fluid/blood.","Connective tissue is characterized by cells embedded in extracellular matrix made of ground substance and fibers.","Fibroblasts synthesize fibers and ground substance in connective tissue.","Adipose tissue stores energy as fat and also cushions and insulates.","Reticular connective tissue forms a supportive framework in organs such as lymph nodes and spleen.","Hyaline cartilage provides firm but somewhat flexible support and smooth surfaces at many joints.","Skeletal muscle is striated, usually voluntary, and has long multinucleated fibers.","Cardiac muscle is striated and involuntary; intercalated discs connect its branching cells.","Smooth muscle is involuntary and nonstriated, with spindle-shaped cells in walls of hollow organs.","Neurons are excitable cells that receive and transmit electrical signals.","Neuroglia support, protect, and maintain the environment around neurons."];const q=sourceQuestions.map(b=>[b.n<=25?0:b.n<=50?1:b.n<=75?2:b.n<=100?3:b.n<=114?0:b.n<=126?1:b.n<=140?2:3, b.n<=100?Math.min(3,Math.floor(((b.n-1)%25)/6.25)):b.n<=152?Math.min(3,Math.floor(((b.n-101)%52)/13)):3, b.t,b.o,b.a,conceptExplanations[b.n<=100?b.n-1:sourceQuestions.findIndex(z=>z.n<=100&&z.o[z.a].toLowerCase()===b.t.split("answer: ")[1]?.toLowerCase())]||"Review the definition and distinguishing features in the topic above."]);q.push(...visualQuestions.map(b=>[3,3,b.t+" (Original packet question "+b.n+") <a href=\"https://drive.google.com/file/d/1BgWc5B3QGOuUOYurUjuXHMrvEDV2glRQ/view\" target=\"_blank\" rel=\"noopener\">Open the original tissue images (questions 153–164)</a>",b.o,b.a,"The correct tissue is "+b.o[b.a]+". Compare the number of layers, cell shape, and visible tissue features in the original micrograph; the question text alone does not show those identifying features."]));let answers={},missed=new Set(),examOrder=[],examPos=0,examAnswers={},examChoices={};try{missed=new Set(JSON.parse(localStorage.getItem("bio233missed")||"[]"))}catch(e){}

function show(view,chapter=0){window.scrollTo(0,0);const a=document.getElementById("app");if(view==="home"){a.innerHTML='<div class="hero"><div class="section-label">BIO 233 • CHAPTERS 1–4</div><h2>Study one topic at a time.</h2><p>Read the outline by chapter, work through examples, and answer questions built into each topic. Check your answers instantly and revisit anything you missed.</p><div class="grid">'+chapters.map((c,i)=>'<button onclick="show(\'chapter\','+i+')"><b>Chapter '+(i+1)+'</b><br>'+c.title+'<br><small>'+c.subtitle+'</small></button>').join("")+'</div></div><div class="card"><h2>Study options</h2><div class="toolbar"><button class="primary" onclick="startExam()">Start mixed practice ('+q.length+' questions)</button><button onclick="show(\'review\')">Review missed</button></div></div>'}

if(view==="review"){a.innerHTML='<div class="card"><h2>Review missed questions</h2><p>Missed items are saved on this device.</p>'+(missed.size?[...missed].map(question).join(""):'No missed questions yet.')+'</div>'}
if(view==="exam")renderExam();updateProgress()}
function question(i){let x=q[i],selected=answers[i];return '<div class="card" id="q'+i+'"><div class="muted">Question '+(i+1)+'</div><b>'+x[2]+'</b>'+x[3].map((opt,k)=>'<button class="choice '+(selected===k?'selected':'')+'" onclick="answer('+i+','+k+')">'+String.fromCharCode(65+k)+'. '+opt+'</button>').join("")+(selected!==undefined?'<div class="answerbox '+(selected===x[4]?'':'bad')+'"><p class="'+(selected===x[4]?'correct':'wrong')+'">'+(selected===x[4]?'✓ Correct':'✗ Not quite. Correct answer: '+String.fromCharCode(65+x[4])+'. '+x[3][x[4]])+'</p><p><strong>Why:</strong> '+x[5]+'</p>'+(selected!==x[4]?'<p><strong>Remember:</strong> '+keyPoints[x[0]][x[1]][0]+'</p>':'')+'</div>':'')+'</div>'}
function answer(i,k){answers[i]=k;if(k===q[i][4])missed.delete(i);else missed.add(i);save();let e=document.getElementById('q'+i);if(e)e.outerHTML=question(i);updateProgress()}

function updateProgress(){document.getElementById('bar').style.width=(Object.keys(answers).length/q.length*100)+'%'}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startExam(ch){examOrder=shuffle(q.map((_,i)=>i).filter(i=>ch===undefined||q[i][0]===ch));examPos=0;examAnswers={};examChoices={};examOrder.forEach(i=>examChoices[i]=shuffle([0,1,2,3]));show('exam')}
