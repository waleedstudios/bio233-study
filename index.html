<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIO 233 Study Hub</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e9edf6;background:#0d1120}*{box-sizing:border-box}body{margin:0}header{background:#161c30;border-bottom:1px solid #303a55;padding:20px}main{max-width:900px;margin:auto;padding:22px}h1{margin:5px 0}h2{margin-top:0}p{line-height:1.6}.muted{color:#abb8d2}.tag{color:#f5a8cc;font-weight:700;letter-spacing:.1em;font-size:12px}.card{background:#192139;border:1px solid #35405e;border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}button{font:inherit;cursor:pointer;border:1px solid #576583;background:#293652;color:white;padding:12px 15px;border-radius:10px}button:hover{background:#3d4e72}button.primary{background:#e64e98;border-color:#e64e98;color:#190b16;font-weight:700}button.selected{border:2px solid #f2a0cb;background:#4d2850}.choice{display:block;width:100%;text-align:left;margin:8px 0}.hidden{display:none}.correct{color:#8de6b6}.wrong{color:#ffb0b0}.example{border-left:4px solid #e64e98;padding:12px 15px;background:#252840;border-radius:7px}.steps{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.step{flex:1;min-width:130px;background:#283750;border-radius:9px;padding:12px;text-align:center}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}a{color:#f5a8cc}details{background:#222d46;padding:13px;border-radius:9px;margin-top:10px}summary{cursor:pointer}#progress{height:8px;background:#35405e;border-radius:8px;overflow:hidden}#bar{height:100%;background:#e64e98;width:0}footer{text-align:center;color:#abb8d2;padding:24px;font-size:13px}@media print{body{background:white;color:black}.card{background:white;color:black}button{display:none}}</style></head><body><header><div style="max-width:900px;margin:auto"><div class="tag">INTERACTIVE STUDY OUTLINE • CHAPTERS 1–4</div><h1>BIO 233 Study Hub</h1><p class="muted">Read each topic, try the questions, and review your answers.</p><div class="toolbar"><button onclick="show('home')">Home</button><button onclick="show('exam')">Mixed practice</button><button onclick="show('review')">Review missed</button></div></div></header><main><div id="progress"><div id="bar"></div></div><div id="app"></div></main><footer>Original practice material based on the BIO 233 Chapters 1–4 study outline. Not an official exam. Progress stays on this device.</footer><script>
const chapters=[
{title:"Introduction to A&P",subtitle:"Anatomy, organization, homeostasis and cavities",lessons:[
["Anatomy and physiology","Anatomy studies structures and relationships. Physiology studies how those structures function.","Ask your partner to describe the structure of the heart versus what the heart does.","The structure is the heart and its chambers; the function is pumping blood."],
["Levels of organization","Chemical → cellular → tissue → organ → organ system → organism.","Have your partner place a muscle cell, muscle tissue, and a muscle organ in order.","Cell → tissue → organ."],
["Homeostasis and feedback","Homeostasis maintains a relatively stable internal environment. A receptor detects change; a control center evaluates it; an effector responds. Negative feedback counteracts a change. Positive feedback amplifies it until an endpoint.","Use rising body temperature: receptors detect the change, control center processes it, sweat glands act, and temperature moves toward normal.","Ask which part senses, decides and acts. Compare sweating with blood clotting."],
["Anatomical language and cavities","Anatomical position is the reference. Sagittal divides left/right; frontal divides front/back; transverse divides upper/lower. Dorsal contains cranial and vertebral cavities. Ventral contains thoracic and abdominopelvic cavities.","Point to your own body and ask for superior, inferior, medial, lateral, proximal and distal.","Visceral serosa covers organs; parietal serosa lines cavity walls."]]},
{title:"Chemical level",subtitle:"Atoms, bonds, reactions and macromolecules",lessons:[
["Atoms and ions","Protons are positive, neutrons neutral, electrons negative. Atomic number is proton count; mass number is protons plus neutrons. Isotopes differ in neutrons.","Draw an atom and change only its neutron count.","Losing an electron forms a positive cation; gaining one forms a negative anion."],
["Chemical bonds and water","Ionic bonds involve attraction between oppositely charged ions; covalent bonds share electrons; hydrogen bonds are weak attractions important in water. Water is polar.","Ask why water molecules attract one another.","Hydrogen bonding contributes to cohesion and surface tension."],
["Reactions, enzymes and pH","Synthesis builds; decomposition breaks down; exchange swaps partners. Enzymes lower activation energy without being consumed. Acids increase H+; buffers resist pH change.","Compare building a chain with breaking one apart.","pH below 7 is acidic, 7 neutral and above 7 basic."],
["Biological molecules","Carbohydrates supply/store energy; triglycerides store energy; phospholipids form membranes. Proteins are amino acids joined by peptide bonds. DNA/RNA are nucleic acids; ATP transfers usable energy.","Have your partner match a molecule to its main role.","Protein shape matters to function."]]},
{title:"Cellular level",subtitle:"Membranes, organelles, transport and division",lessons:[
["Membranes and organelles","The plasma membrane is a phospholipid bilayer: hydrophilic heads face water, hydrophobic tails face inward. Nucleus stores DNA; ribosomes make protein; rough ER handles protein; smooth ER handles lipids; Golgi sorts; mitochondria produce ATP; lysosomes digest.","Ask your partner to describe a cell as a workplace and assign each organelle a job.","Cytosol is the fluid portion of cytoplasm."],
["Transport and tonicity","Simple diffusion moves down a gradient; facilitated diffusion uses channels/carriers; osmosis moves water; active transport requires energy; endocytosis brings bulk material in and exocytosis moves it out.","Draw a cell in a hypertonic solution and ask where water goes.","Hypotonic: water enters. Hypertonic: water leaves. Isotonic: no net movement."],
["DNA and protein synthesis","DNA wraps around histones. Transcription makes RNA from DNA; translation uses ribosomes, mRNA and tRNA to assemble a polypeptide.","Ask your partner to put DNA → RNA → protein in words.","mRNA carries coding information; tRNA carries amino acids; rRNA is part of ribosomes."],
["Cell cycle","Interphase consists of G1, S and G2; DNA replicates in S. Mitosis proceeds prophase, metaphase, anaphase, telophase; cytokinesis divides cytoplasm.","Ask your partner to explain why DNA must replicate before division.","Have them recite PMAT in order."]]},
{title:"Tissue level",subtitle:"Epithelial, connective, muscle and nervous tissue",lessons:[
["Four tissue categories","Epithelial tissue covers, lines and secretes; connective supports, binds and stores; muscle contracts; nervous tissue communicates.","Point to a body structure and ask which category best describes it.","Epithelial tissue is avascular and rests on a basement membrane."],
["Epithelial identification","Simple means one layer; stratified means multiple. Squamous cells are flat, cuboidal are cube-like and columnar are tall. Transitional epithelium stretches.","Identify layer count first, then the shape of surface cells.","Simple squamous supports rapid diffusion; stratified squamous protects."],
["Connective tissue","Connective tissue includes cells and extracellular matrix. Areolar cushions/binds, adipose stores energy, reticular supports. Hyaline, elastic and fibrocartilage have distinct support roles.","Ask what fibroblasts produce and why extracellular matrix matters.","Dense regular resists pull in one direction; dense irregular resists stress in multiple directions."],
["Muscle and nervous tissue","Skeletal muscle is voluntary, striated and multinucleate. Cardiac is striated and has intercalated discs. Smooth is nonstriated and spindle-shaped. Neurons conduct signals; neuroglia support.","Compare muscle types without looking at notes.","Repair may involve regeneration or fibrosis (scar)."]]}];
const q=[
[0,0,"What does anatomy study?",["Structure and relationships","How structures function","Only chemical reactions","Only disease"],0,"Anatomy concerns structure; physiology concerns function."],
[0,1,"Which sequence is correct?",["Organ → tissue → cell","Chemical → cellular → tissue → organ → organ system → organism","Tissue → chemical → organ","Organism → cell → chemical"],1,"Organization progresses from chemical to organism."],
[0,2,"Which feedback opposes an initial change?",["Positive","Negative","Both always amplify","Neither"],1,"Negative feedback counteracts a deviation."],
[0,2,"Which component carries out a homeostatic response?",["Receptor","Control center","Effector","Stimulus"],2,"The effector produces the response."],
[0,3,"Which plane divides superior and inferior portions?",["Sagittal","Frontal","Transverse","Median"],2,"Transverse divides upper and lower portions."],
[0,3,"Which serous layer covers the organ?",["Parietal","Visceral","Dorsal","Cranial"],1,"Visceral covers the organ; parietal lines the wall."],
[1,0,"Atomic number equals the number of:",["Neutrons","Electrons plus neutrons","Protons","Protons plus neutrons"],2,"Element identity is determined by proton count."],
[1,0,"An atom that loses an electron becomes a:",["Negative anion","Positive cation","Neutral isotope","Neutron"],1,"Losing a negative electron yields a positive ion."],
[1,1,"Which bond shares electrons?",["Ionic","Covalent","Hydrogen","None"],1,"Covalent bonds involve shared electrons."],
[1,1,"Which bond contributes to water's cohesion?",["Hydrogen","Peptide","Ionic only","Metallic"],0,"Hydrogen bonding contributes to cohesion."],
[1,2,"What do enzymes lower?",["Mass number","Activation energy","pH in every reaction","Atom count"],1,"Enzymes lower activation energy and are not consumed."],
[1,2,"What do buffers resist?",["All reactions","Changes in pH","Diffusion","Protein synthesis"],1,"Buffers moderate changes in pH."],
[1,3,"Which bonds connect amino acids?",["Hydrogen only","Peptide","Ionic only","Phosphodiester only"],1,"Peptide bonds join amino acids in proteins."],
[2,0,"Which organelle modifies and sorts proteins?",["Golgi apparatus","Nucleus","Lysosome","Smooth ER"],0,"Golgi modifies and sorts."],
[2,0,"Phospholipid tails are:",["Hydrophilic","Hydrophobic","Ionic","Made of DNA"],1,"Tails face inward away from water."],
[2,1,"A cell in a hypertonic solution tends to:",["Gain water","Lose water","Divide immediately","Make more DNA"],1,"Water moves out in a hypertonic environment."],
[2,1,"Which process moves water across a selectively permeable membrane?",["Translation","Osmosis","Exocytosis","Mitosis"],1,"Osmosis is water movement."],
[2,2,"What is the product of transcription?",["RNA","Protein","ATP","A cell"],0,"Transcription makes RNA from a DNA template."],
[2,3,"DNA replication occurs during:",["G1","S","G2","Telophase"],1,"The S phase synthesizes DNA."],
[3,0,"Which tissue lines exposed and internal surfaces?",["Muscle","Nervous","Epithelial","Cartilage"],2,"Epithelial tissue covers and lines."],
[3,1,"Simple epithelium means:",["Multiple layers","One cell layer","No cells","Only flat cells"],1,"Simple refers to one layer."],
[3,1,"Which epithelium stretches in urinary organs?",["Simple squamous","Transitional","Simple cuboidal","Stratified columnar"],1,"Transitional epithelium accommodates stretch."],
[3,2,"Which loose connective tissue stores fat?",["Areolar","Reticular","Adipose","Hyaline"],2,"Adipose tissue stores energy."],
[3,2,"Which cartilage is common on joint surfaces?",["Hyaline","Elastic","Fibrocartilage","Reticular"],0,"Hyaline cartilage provides smooth support."],
[3,3,"Which muscle has intercalated discs?",["Skeletal","Smooth","Cardiac","All three"],2,"Intercalated discs characterize cardiac muscle."],
[3,3,"Which nervous cells conduct impulses?",["Fibroblasts","Neurons","Adipocytes","Chondrocytes"],1,"Neurons conduct signals."],
];
let answers={},missed=new Set(),examOrder=[],examPos=0,examAnswers={};try{missed=new Set(JSON.parse(localStorage.getItem("bio233missed")||"[]"))}catch(e){}
function save(){localStorage.setItem("bio233missed",JSON.stringify([...missed]))}
function show(view,chapter=0){window.scrollTo(0,0);const a=document.getElementById("app");if(view==="home"){a.innerHTML='<div class="card"><h2>Interactive study outline</h2><p>Read the outline by chapter, work through examples, and answer questions built into each topic. Check your answers instantly and revisit anything you missed.</p><div class="grid">'+chapters.map((c,i)=>'<button onclick="show(\'chapter\','+i+')"><b>Chapter '+(i+1)+'</b><br>'+c.title+'<br><small>'+c.subtitle+'</small></button>').join("")+'</div></div><div class="card"><h2>Study options</h2><div class="toolbar"><button class="primary" onclick="startExam()">Start mixed practice ('+q.length+' questions)</button><button onclick="show(\'review\')">Review missed</button></div></div>'}
if(view==="chapter"){let c=chapters[chapter];a.innerHTML='<div class="card"><button onclick="show(\'home\')">← All chapters</button><h2>Chapter '+(chapter+1)+': '+c.title+'</h2><p class="muted">'+c.subtitle+'</p></div>'+c.lessons.map((l,j)=>'<section class="card"><div class="tag">LESSON '+(j+1)+'</div><h2>'+l[0]+'</h2><p>'+l[1]+'</p><div class="example"><b>Example</b><p>'+l[2]+'</p></div><details '+''+'><summary>More explanation</summary><p>'+l[3]+'</p></details><h3>Knowledge check</h3>'+q.map((x,i)=>x[0]===chapter&&x[1]===j?question(i):'').join("")+'</section>').join('')+'<button class="primary" onclick="startExam('+chapter+')">Practice Chapter '+(chapter+1)+'</button>'}
if(view==="review"){a.innerHTML='<div class="card"><h2>Review missed questions</h2><p>Missed items are saved on this device.</p>'+(missed.size?[...missed].map(question).join(""):'No missed questions yet.')+'</div>'}
if(view==="exam")renderExam();updateProgress()}
function question(i){let x=q[i],selected=answers[i];return '<div class="card" id="q'+i+'"><div class="muted">Question '+(i+1)+'</div><b>'+x[2]+'</b>'+x[3].map((opt,k)=>'<button class="choice '+(selected===k?'selected':'')+'" onclick="answer('+i+','+k+')">'+String.fromCharCode(65+k)+'. '+opt+'</button>').join("")+(selected!==undefined?'<p class="'+(selected===x[4]?'correct':'wrong')+'">'+(selected===x[4]?'✓ Correct':'✗ Correct answer: '+String.fromCharCode(65+x[4])+'. '+x[3][x[4]])+'</p><p>'+x[5]+'</p>':'')+'</div>'}
function answer(i,k){answers[i]=k;if(k===q[i][4])missed.delete(i);else missed.add(i);save();let e=document.getElementById('q'+i);if(e)e.outerHTML=question(i);updateProgress()}

function updateProgress(){document.getElementById('bar').style.width=(Object.keys(answers).length/q.length*100)+'%'}
function startExam(ch){examOrder=q.map((_,i)=>i).filter(i=>ch===undefined||q[i][0]===ch);examPos=0;examAnswers={};show('exam')}
function renderExam(){let a=document.getElementById('app');if(!examOrder.length){a.innerHTML='<div class="card"><h2>Mixed practice</h2><p>Test your understanding with '+q.length+' questions from Chapters 1–4.</p><button class="primary" onclick="startExam()">Start practice</button></div>';return}if(examPos>=examOrder.length){let n=examOrder.filter(i=>examAnswers[i]===q[i][4]).length;a.innerHTML='<div class="card"><h2>Practice complete</h2><h1>'+n+' / '+examOrder.length+'</h1><p>Review the questions below. This is an original practice set, not your actual exam.</p><button onclick="show(\'review\')">Review missed</button><button onclick="startExam()">Try again</button></div>'+examOrder.map(i=>question(i)).join('');return}let i=examOrder[examPos],x=q[i];a.innerHTML='<div class="card"><div class="tag">QUESTION '+(examPos+1)+' OF '+examOrder.length+'</div><h2>'+x[2]+'</h2>'+x[3].map((o,k)=>'<button class="choice '+(examAnswers[i]===k?'selected':'')+'" onclick="pickExam('+i+','+k+')">'+String.fromCharCode(65+k)+'. '+o+'</button>').join('')+'<button class="primary" '+(examAnswers[i]===undefined?'disabled':'')+' onclick="nextExam()">Next →</button></div>'}
function pickExam(i,k){examAnswers[i]=k;renderExam()}
function nextExam(){let i=examOrder[examPos];answers[i]=examAnswers[i];if(answers[i]===q[i][4])missed.delete(i);else missed.add(i);save();examPos++;renderExam();updateProgress()}
show('home');
</script></body></html>
