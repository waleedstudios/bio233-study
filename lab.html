<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=modern.html"><title>BIO 233 Visual Study Hub</title><script>location.replace('modern.html'+location.search+location.hash)</script>
<style id="visual-redesign-v3">
:root{
  --chapterAccent:#ff6fb7;
  --chapterAccent2:#7c5cff;
  --bgA:#08111f;
  --bgB:#10162d;
  --glass:rgba(14,23,42,.72);
  --glass2:rgba(255,255,255,.055);
}
html{scroll-behavior:smooth}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 8% 15%,rgba(0,216,255,.15),transparent 28%),
    radial-gradient(circle at 92% 8%,rgba(255,82,168,.20),transparent 32%),
    radial-gradient(circle at 70% 78%,rgba(125,92,255,.16),transparent 34%),
    linear-gradient(135deg,var(--bgA),var(--bgB) 48%,#09101f);
  background-attachment:fixed;
}
body:before,body:after{
  content:"";position:fixed;pointer-events:none;z-index:-2;border-radius:50%;filter:blur(70px);opacity:.38;
  animation:bioFloat 16s ease-in-out infinite alternate;
}
body:before{width:34rem;height:34rem;background:#ff4aa8;left:-12rem;top:18%}
body:after{width:30rem;height:30rem;background:#5a67ff;right:-9rem;bottom:8%;animation-delay:-7s}
@keyframes bioFloat{from{transform:translate3d(0,-24px,0) scale(.9)}to{transform:translate3d(30px,35px,0) scale(1.12)}}
header{
  background:rgba(6,11,24,.68)!important;
  border-bottom:1px solid rgba(255,255,255,.09)!important;
  box-shadow:0 18px 50px rgba(0,0,0,.22);
}
.wrap{max-width:1180px!important}
.card{
  background:linear-gradient(145deg,rgba(20,31,54,.82),rgba(10,17,32,.8))!important;
  border:1px solid rgba(255,255,255,.10)!important;
  backdrop-filter:blur(18px);
  box-shadow:0 24px 70px rgba(0,0,0,.24)!important;
}
.hero{
  overflow:hidden;position:relative;
  background:
    linear-gradient(135deg,rgba(255,85,170,.14),rgba(73,106,255,.15)),
    linear-gradient(150deg,rgba(21,29,52,.96),rgba(10,17,32,.94))!important;
}
.hero:after{
  content:"";position:absolute;width:290px;height:290px;border-radius:50%;
  background:radial-gradient(circle,var(--chapterAccent),transparent 67%);
  opacity:.16;right:-100px;top:-110px;filter:blur(12px);pointer-events:none
}
h1{font-size:clamp(36px,6vw,66px)!important;line-height:.98!important;letter-spacing:-.055em!important}
h2{font-size:clamp(25px,3.6vw,38px)}
.tag{color:#ffb5db!important}
.nav a,button{
  border:1px solid rgba(255,255,255,.13)!important;
  background:rgba(255,255,255,.065)!important;
  backdrop-filter:blur(10px);
}
.nav a.active,button.primary{
  background:linear-gradient(110deg,var(--chapterAccent),var(--chapterAccent2))!important;
  border-color:transparent!important;color:#fff!important;
  box-shadow:0 10px 28px color-mix(in srgb,var(--chapterAccent) 28%,transparent);
}
.chapter{
  min-height:190px!important;position:relative;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.035))!important;
  border-radius:22px!important;padding:22px!important;
  transform-style:preserve-3d;
}
.chapter:before{content:"";position:absolute;inset:auto -20% -40% 25%;height:130px;background:radial-gradient(circle,var(--cc,#ff6fae),transparent 70%);opacity:.18}
.chapter:hover{transform:translateY(-5px) scale(1.01)!important;box-shadow:0 20px 45px rgba(0,0,0,.28)}
.chapter-icon{font-size:34px;display:block;margin-bottom:12px;filter:drop-shadow(0 7px 14px rgba(0,0,0,.25))}
.chapter-number{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d9e3f7;font-weight:800}
.chapter b{font-size:21px!important}
.chapter small{min-height:62px}
#progress{background:rgba(255,255,255,.09)!important}
#bar{background:linear-gradient(90deg,#00d8ff,#7b61ff,#ff5cad,#ffb86b)!important;box-shadow:0 0 18px rgba(255,92,173,.65)}
.chapter-hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr);gap:28px;align-items:center}
.hero-visual,.topic-visual{
  border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.12);
  background:
    radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--chapterAccent) 30%,transparent),transparent 45%),
    linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
}
.hero-visual{padding:20px;min-height:250px;display:grid;place-items:center}
.hero-visual svg{width:100%;max-height:260px}
.topic-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:20px}
.topic-card{
  position:relative;overflow:hidden;border-radius:22px;padding:0;
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  border:1px solid rgba(255,255,255,.10);
  opacity:0;transform:translateY(26px) scale(.985);
  transition:opacity .65s ease,transform .65s cubic-bezier(.2,.8,.2,1),border-color .2s ease;
}
.topic-card.revealed{opacity:1;transform:none}
.topic-card:hover{border-color:color-mix(in srgb,var(--chapterAccent) 58%,white 8%)}
.topic-visual{border-radius:0;border:0;border-bottom:1px solid rgba(255,255,255,.09);min-height:210px;display:grid;place-items:center;padding:16px}
.topic-visual svg{width:100%;height:190px;display:block}
.topic-copy{padding:20px}
.topic-kicker{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.topic-kicker span:first-child{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#b9c6de}
.topic-copy h3{font-size:21px;margin:0 0 8px;color:#fff!important}
.topic-copy p{color:#c9d4e8;line-height:1.72;margin:0}
.source-pill{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 10px;border-radius:999px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);font-size:12px;color:#dce6f7;
}
.source-pill:before{content:"◉";color:var(--chapterAccent)}
.resource-note{
  margin-top:18px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.045);
  border:1px dashed rgba(255,255,255,.14);color:#bfcbe0;line-height:1.6;font-size:13px
}
.textbook-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.textbook-card{padding:0!important;overflow:hidden}
.textbook-card .topic-visual{min-height:155px}.textbook-card .topic-visual svg{height:140px}
.textbook-body{padding:18px}
.textbook-body h3{color:#fff!important}
.textbook-body details{margin-top:14px}
.chapter-source-banner{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 0;
  color:#c5d1e5;font-size:13px
}
.chapter-source-banner strong{color:white}
.floating-chip{
  position:absolute;right:18px;top:18px;padding:7px 10px;border-radius:999px;
  border:1px solid rgba(255,255,255,.12);background:rgba(6,12,25,.35);font-size:11px;color:#dce7f8
}
#cursorDot,#cursorRing{position:fixed;pointer-events:none;z-index:9999;left:0;top:0;transform:translate(-50%,-50%);display:none}
#cursorDot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 18px var(--chapterAccent)}
#cursorRing{width:34px;height:34px;border-radius:50%;border:1px solid color-mix(in srgb,var(--chapterAccent) 72%,white);transition:width .18s,height .18s,background .18s,border-color .18s;mix-blend-mode:screen}
body.cursor-on{cursor:none}.cursor-on a,.cursor-on button,.cursor-on summary{cursor:none}
#cursorRing.hot{width:52px;height:52px;background:color-mix(in srgb,var(--chapterAccent) 12%,transparent);border-color:#fff}
.scroll-meter{position:fixed;right:18px;bottom:18px;z-index:70;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(8,14,29,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);font-size:11px;color:#fff}
.scroll-meter:before{content:"";position:absolute;inset:4px;border-radius:50%;background:conic-gradient(var(--chapterAccent) var(--scroll,0%),rgba(255,255,255,.08) 0);-webkit-mask:radial-gradient(circle,transparent 55%,#000 57%);mask:radial-gradient(circle,transparent 55%,#000 57%)}
@media(max-width:760px){
  .chapter-hero-grid,.topic-gallery,.textbook-grid{grid-template-columns:1fr}
  .hero-visual{min-height:210px}
  .topic-card{opacity:1;transform:none}
  .scroll-meter{right:10px;bottom:10px}
}
@media(pointer:fine){#cursorDot,#cursorRing{display:block}}
@media(prefers-reduced-motion:reduce){
  body:before,body:after{animation:none}
  .topic-card{opacity:1;transform:none;transition:none}
  .chapter:hover{transform:none!important}
}
</style>

    const heroVisual=visualFor(c.n,Math.min(2,c.points.length-1),c.title);
    v.innerHTML=
      '<div class="card hero"><div class="chapter-hero-grid"><div><div class="tag">Chapter '+c.n+'</div><h2>'+c.title+'</h2><p class="muted">'+c.sub+'</p><div class="chapter-source-banner"><strong>Visual source anchors:</strong><span>Your lecture slides + Martini & Nath textbook figures</span></div><div class="toolbar" style="margin-top:18px"><button onclick="showHome()">← All chapters</button><button class="primary" onclick="startQuiz('+c.n+')">Practice Chapter '+c.n+' · '+chapterQuestions.length+' questions</button></div></div><figure class="hero-visual">'+heroVisual+'<span class="floating-chip">interactive visual</span></figure></div></div>'+
      '<div class="card"><div class="tag">Visual lecture map</div><h2>Every topic, with a picture</h2><p class="muted">Each card pairs your lecture wording with a visual model and the closest figure or section from your uploaded class resources.</p><div class="topic-gallery">'+
        c.points.map((p,j)=>'<article class="topic-card"><figure class="topic-visual">'+visualFor(c.n,j,p[0])+'</figure><div class="topic-copy"><div class="topic-kicker"><span>Topic '+(j+1)+'</span><span class="count">lecture</span></div><h3>'+p[0]+'</h3><p>'+p[1]+'</p><div class="source-pill">'+((sourceAnchors[c.n]||[])[j]||("Chapter "+c.n+" lecture + textbook"))+'</div></div></article>').join('')+
      '</div><div class="resource-note">The figure labels above point you back to the uploaded lecture decks and textbook material used to build this study hub. The colorful diagrams here are original study visuals so the site stays fast, responsive, and readable on your phone.</div></div>'+
      '<div class="card"><div class="tag">Textbook support</div><h2>Fill in the “why” visually</h2><div class="textbook-grid">'+
        textbook.map((t,j)=>'<article class="mini textbook-card"><figure class="topic-visual">'+visualFor(c.n,j,t.title)+'</figure><div class="textbook-body"><div class="question-meta"><h3 style="margin:0">'+t.title+'</h3><span class="count">pp. '+t.pages+'</span></div><p>'+t.notes+'</p><details><summary>Active recall: '+t.question+'</summary><p><b>'+t.options[0]+'</b></p></details></div></article>').join('')+
      '</div></div>'+
      '<div class="card"><div class="tag">Chapter practice</div><h2>'+chapterQuestions.length+' questions</h2><p class="muted">Use the visuals first, then test recognition and recall.</p><div class="toolbar"><button class="primary" onclick="startQuiz('+c.n+')">Start Chapter '+c.n+'</button><button onclick="reviewMissed('+c.n+')">Review missed from Chapter '+c.n+'</button></div></div>';
    showOnly("chapterView");
    requestAnimationFrame(()=>initReveals());
  };
  function initReveals(){
    const cards=[...document.querySelectorAll(".topic-card")];
    if(!("IntersectionObserver" in window)){cards.forEach(x=>x.classList.add("revealed"));return}
    const obs=new IntersectionObserver((entries)=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("revealed");obs.unobserve(e.target)}}),{threshold:.13});
    cards.forEach(x=>obs.observe(x));
  }
  const chapterColors=["#ff6f91","#55d6be","#62d0ff","#7b61ff","#ffb347","#00d8ff"];
  document.querySelectorAll(".chapter").forEach((btn,i)=>{
    btn.style.setProperty("--cc",chapterColors[i]||"#ff6fae");
    const b=btn.querySelector("b");
    if(b&&!btn.querySelector(".chapter-icon")){
      b.insertAdjacentHTML("beforebegin",'<span class="chapter-icon">'+(icons[i+5]||"✦")+'</span><span class="chapter-number">Chapter '+(i+5)+'</span><br>');
    }
  });
  const hero=document.querySelector("#home .hero");
  if(hero&&!hero.querySelector(".chapter-source-banner")){
    hero.querySelector("p").insertAdjacentHTML("afterend",'<div class="chapter-source-banner"><strong>Built from:</strong><span>your Chapters 5–10 lecture decks · Martini & Nath · your handwritten-note question bank</span></div>');
  }
  const dot=document.createElement("div"), ring=document.createElement("div");
  dot.id="cursorDot";ring.id="cursorRing";document.body.append(dot,ring);
  if(matchMedia("(pointer:fine)").matches){
    document.body.classList.add("cursor-on");
    let mx=0,my=0,rx=0,ry=0;
    addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY;dot.style.transform="translate("+(mx-3.5)+"px,"+(my-3.5)+"px)"});
    const loop=()=>{rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.transform="translate("+(rx-17)+"px,"+(ry-17)+"px)";requestAnimationFrame(loop)};loop();
    document.addEventListener("mouseover",e=>{if(e.target.closest("button,a,summary,.topic-card"))ring.classList.add("hot")});
    document.addEventListener("mouseout",e=>{if(e.target.closest("button,a,summary,.topic-card"))ring.classList.remove("hot")});
  }
  const meter=document.createElement("div");meter.className="scroll-meter";meter.textContent="TOP";meter.title="Scroll progress / back to top";meter.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));document.body.append(meter);
  const updateMeter=()=>{const d=document.documentElement;const max=d.scrollHeight-d.clientHeight;const pct=max?Math.round(d.scrollTop/max*100):0;meter.style.setProperty("--scroll",pct+"%");meter.textContent=pct+"%"};addEventListener("scroll",updateMeter,{passive:true});updateMeter();
  setAccent(10);
})();
</script>
</body></html>
