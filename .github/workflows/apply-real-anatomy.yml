name: Prepare Real Anatomy and Full Practice
on:
  push:
    branches: [real-anatomy-full-practice-20261113]
    paths: [.github/workflows/apply-real-anatomy.yml]
permissions:
  contents: write
concurrency:
  group: bio233-real-anatomy
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-anatomy-full-practice-20261113
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify reviewed update
        env:
          BUNDLE_URL: https://at.adobe.com/Ax70hFQ6dnLtCS2n
        run: |
          curl --fail --location --retry 3 "$BUNDLE_URL" -o "$RUNNER_TEMP/anatomy-update.zip"
          echo "19e6d2879101b028b7db18b5f9e172ac031f19ac4cab7cf29ca7093191e72d95  $RUNNER_TEMP/anatomy-update.zip" | sha256sum --check
          python - <<'PY'
          import zipfile,os
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'anatomy-update.zip') as z:
              assert sum(i.file_size for i in z.infolist())<20_000_000
              for i in z.infolist():
                  p=Path(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert (i.external_attr>>16)&0o170000 != 0o120000
              z.extractall(Path(os.environ['RUNNER_TEMP'])/'anatomy-update')
          PY
          python "$RUNNER_TEMP/anatomy-update/apply_update.py" "$GITHUB_WORKSPACE"
      - name: Validate data and JavaScript
        run: |
          python tests/validate-study-guide.py
          node --input-type=module --check < studio.js
          node --check real-anatomy.mjs
          node --check anatomy-atlas.mjs
      - name: Install browser testing dependencies
        run: |
          pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.51.1
      - name: Check full bank, source labeling and mobile views
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          python -m http.server 8765 > "$RUNNER_TEMP/site-http.log" 2>&1 &
          python tests/anatomy-browser.py
          node tests/study-guide-browser.cjs
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json,subprocess
          m=json.load(open('anatomy-update-manifest.json'))
          subprocess.run(['git','add','--']+[f['path'] for f in m['files']]+['anatomy-update-manifest.json'],check=True)
          PY
          git diff --cached --stat
          git commit -m "Use original anatomy figures and all 390 randomized practice questions"
          git push origin HEAD:real-anatomy-full-practice-20261113
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-practice-verification
          path: |
            qa/
            anatomy-update-manifest.json
          retention-days: 3
