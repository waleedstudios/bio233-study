name: Verify Chapters 14-16 Publication
on:
  push:
    branches: [main]
    paths:
      - index.html
      - exam4*
      - assets/exam4/**
      - tests/*exam4*
      - .github/workflows/verify-exam4.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate source coverage and JavaScript
        run: |
          python tests/validate-exam4.py
          node --input-type=module --check < exam4.js
      - name: Verify the published workspace and course images
        env:
          SITE_URL: https://waleedstudios.github.io/bio233-study/
        run: |
          python - <<'PY'
          import os,json,time,hashlib,urllib.request,concurrent.futures
          from pathlib import Path
          base=os.environ['SITE_URL'];tag=os.environ['GITHUB_SHA']
          def get(path):
              req=urllib.request.Request(base+path+'?verify='+tag,headers={'Cache-Control':'no-cache','User-Agent':'BIO233-Exam4-Publication-Check'})
              with urllib.request.urlopen(req,timeout=40) as response:
                  assert response.status==200
                  return response.read()
          def digest(data):return hashlib.sha256(data).hexdigest()
          expected=Path('exam4-version.json').read_bytes()
          for attempt in range(36):
              try:
                  assert digest(get('exam4-version.json'))==digest(expected)
                  assert b'href="exam4.html"' in get('index.html')
                  assert digest(get('exam4.js'))==digest(Path('exam4.js').read_bytes())
                  break
              except Exception as exc:
                  if attempt==35:raise
                  print('Checking Pages deployment:',type(exc).__name__,flush=True)
                  time.sleep(10)
          library=json.loads(Path('exam4-sources.json').read_text())
          paths=['exam4.html','exam4.js','exam4.css','exam4-content.json','exam4-sources.json','exam4-version.json']+[p['image'] for p in library['pages']]
          def check(path):
              raw=get(path);assert digest(raw)==digest(Path(path).read_bytes()),path
              return {'path':path,'bytes':len(raw),'sha256':digest(raw)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:verified=list(pool.map(check,paths))
          for path in ['index.html','exam1.html','lab.html','exam2-lab.html']:
              assert len(get(path))>100
          report={'status':'PASS','version':json.loads(expected)['version'],'counts':json.loads(expected)['counts'],'verified':verified,'earlierPagesReachable':True}
          Path('exam4-publication-report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({'status':'PASS','counts':report['counts'],'publicFilesVerified':len(verified)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exam4-publication-report
          path: exam4-publication-report.json
          retention-days: 14
