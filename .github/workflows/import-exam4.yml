name: Prepare Chapters 14-16 Workspace
on:
  push:
    branches: [exam4-chapters14-16-20261117]
    paths: [.github/workflows/import-exam4.yml]
permissions:
  contents: write
concurrency:
  group: bio233-exam4-import
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exam4-chapters14-16-20261117
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified source-grounded update
        env:
          BUNDLE_URL: https://at.adobe.com/10LNd8z3sc7hUyPJ
        run: |
          curl --fail --location --retry 3 "$BUNDLE_URL" -o "$RUNNER_TEMP/exam4.zip"
          echo "1da6a2b6019d24390e1f30ef2c48e20b2919388380a0d62b92a5f2c29caccba9  $RUNNER_TEMP/exam4.zip" | sha256sum --check
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'exam4.zip') as z:
              assert sum(i.file_size for i in z.infolist())<40_000_000
              for i in z.infolist():
                  p=Path(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert (i.external_attr>>16)&0o170000!=0o120000
              z.extractall(Path(os.environ['RUNNER_TEMP'])/'exam4')
          PY
          python "$RUNNER_TEMP/exam4/apply_exam4.py" "$GITHUB_WORKSPACE"
      - name: Validate content, source ranges, assets and script
        run: |
          python tests/validate-exam4.py
          node --input-type=module --check < exam4.js
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Test every question and new study flow
        run: |
          python -m http.server 8765 > "$RUNNER_TEMP/exam4-http.log" 2>&1 &
          python tests/exam4-browser.py
      - name: Commit only verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json,subprocess
          manifest=json.load(open('exam4-import-manifest.json'))
          subprocess.run(['git','add','--','index.html','exam4-import-manifest.json']+[f['path'] for f in manifest['files']],check=True)
          PY
          git diff --cached --stat
          git commit -m "Add Exam 4 with 38 source-linked topics, 163 randomized questions and 63 course visuals"
          git push origin HEAD:exam4-chapters14-16-20261117
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam4-browser-verification
          path: |
            qa-exam4/
            exam4-version.json
          retention-days: 7
