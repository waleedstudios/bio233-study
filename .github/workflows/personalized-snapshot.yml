name: Snapshot Current Study Site
on:
  push:
    branches: [personalized-sheet-lecture-20261117]
    paths: [.github/workflows/personalized-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o /tmp/bio233-personalized-baseline.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bio233-personalized-baseline
          path: /tmp/bio233-personalized-baseline.zip
          retention-days: 1
