name: Final Personal Study Compatibility Check
on:
  push:
    branches: [personalized-sheet-lecture-20261117]
    paths: [.github/workflows/finalize-personalized.yml]
permissions:
  contents: write
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personalized-sheet-lecture-20261117
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve historical card records while excluding them from active study
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('exam4.js');s=p.read_text()
          changes={
              'let course,library,questions,qmap,topics,state=fresh()':'let course,library,questions,qmap,topics,allCards=[],state=fresh()',
              'for(const c of course.cards){const r=raw.cards?.[c.id]':'for(const c of allCards){const r=raw.cards?.[c.id]',
              'course.cards=course.cards.filter(c=>!c.examExcluded)':'allCards=course.cards;course.cards=allCards.filter(c=>!c.examExcluded)',
              "Object.keys(state.cards).length+'/'+course.cards.length":"course.cards.filter(c=>state.cards[c.id]).length+'/'+course.cards.length",
              "This topic extends beyond the dedicated coverage in the uploaded lecture PDFs. Lecture emphasis remains pending.":"This topic extends beyond the dedicated coverage in the uploaded lecture PDFs. Any newly confirmed spoken emphasis is identified in the lecture guidance above; broader coverage remains pending."
          }
          for old,new in changes.items():
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new)
          p.write_text(s)
          m=json.loads(Path('personalized-update-manifest.json').read_text())
          for f in m['files']:
              data=Path(f['path']).read_bytes();f['sha256']=hashlib.sha256(data).hexdigest();f['bytes']=len(data)
          extra=Path('tests/personalized-compatibility.py');data=extra.read_bytes()
          m['files'].append({'path':str(extra),'before':None,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          Path('personalized-update-manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
          node --input-type=module --check < exam4.js
          python tests/validate-exam4.py
          node tests/diagnostic-engine.test.mjs
      - name: Install both browser engines
        run: |
          pip install playwright==1.51.0
          python -m playwright install --with-deps chromium webkit
      - name: Check private sheets, local storage and historical records
        run: |
          python -m http.server 8765 > "$RUNNER_TEMP/compatibility-http.log" 2>&1 &
          python tests/personalized-compatibility.py
          python tests/exam4-browser.py
      - name: Commit verified preservation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam4.js personalized-update-manifest.json
          git commit -m "Keep historical reference-only card ratings and verify WebKit private-study support"
          git push origin HEAD:personalized-sheet-lecture-20261117
      - name: Save compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-study-compatibility
          path: |
            qa-compatibility/
            qa-exam4/report.json
          retention-days: 7
