name: Anatomy Update Snapshot
on:
  push:
    branches: [real-anatomy-full-practice-20261113]
    paths: [.github/workflows/anatomy-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package current site for editing and regression tests
        run: git archive --format=zip HEAD -o /tmp/bio233-current.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bio233-current-site
          path: /tmp/bio233-current.zip
          retention-days: 1
